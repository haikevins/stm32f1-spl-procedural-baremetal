# ST-LINK/V2 four-wire configuration for OpenOCD 0.12.x
#
# Wiring:
#   ST-LINK VCC   -> target 3.3V
#   ST-LINK GND   -> target GND
#   ST-LINK SWDIO -> target PA13 / SWDIO
#   ST-LINK SWCLK -> target PA14 / SWCLK
#
# This project intentionally uses the native ST-LINK DAP driver instead of
# the legacy HLA driver. The native driver accepts the target DPIDR observed
# on this Blue Pill-compatible board and works with ST-LINK/V2 firmware V2J24+
# (the tested probe reports V2J45).

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

source [find target/stm32f1x.cfg]

# stm32f1x.cfg may set another speed, so override it after sourcing the target.
adapter speed 100

# The four-wire probe has no NRST connection. Reset/power-cycle the target
# manually and use BOOT0 when recovery access is required.
reset_config none
